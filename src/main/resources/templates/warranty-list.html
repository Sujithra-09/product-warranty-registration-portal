<!DOCTYPE html>
<html>
<head>
    <title>Warranty Portal - All Warranties</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .header {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 22px 50px;
        }

        .header h2 {
            font-size: 24px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 25px;
        }

        h1 {
            color: #203a43;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #203a43;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
            color: #444;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            font-weight: bold;
            padding: 7px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 22px;
            background: #203a43;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .back-btn:hover {
            background: #2c5364;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>🛡️ Warranty Portal</h2>
    </div>

    <div class="container">

        <h1>All Registered Warranties</h1>

        <p class="subtitle">
            View warranty details, expiry dates and current status
        </p>

        <div class="table-card">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product Name</th>
                        <th>Product ID</th>
                        <th>Customer Name</th>
                        <th>Purchase Date</th>
                        <th>Expiry Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="warranty : ${warranties}">

                        <td th:text="${warranty.id}"></td>

                        <td th:text="${warranty.productName}"></td>

                        <td th:text="${warranty.productId}"></td>

                        <td th:text="${warranty.customerName}"></td>

                        <td th:text="${warranty.purchaseDate}"></td>

                        <td th:text="${warranty.expiryDate}"></td>

                        <td>
                            <span class="status"
                                  th:text="${warranty.warrantyStatus}">
                            </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(warranties)}">
                        <td colspan="7" class="empty">
                            No warranty records found.
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

        <a href="/admin-dashboard" class="back-btn">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
